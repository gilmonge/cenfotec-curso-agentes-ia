<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Historias de Usuario - Asistente de análisis de requerimientos</title>
    <meta name="description" content="Plataforma con Inteligencia Artificial para la gestión, análisis y generación de Historias de Usuario y Criterios de Aceptación." />
      <script>
      // Aplica el tema antes de pintar para evitar el destello claro/oscuro.
      try {
        var t = localStorage.getItem('historias_usuario_tema');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
