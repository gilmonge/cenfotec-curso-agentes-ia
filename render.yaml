# Blueprint de Render: crea el servicio y lo despliega solo con cada cambio en main.
# Los valores con sync: false se piden una vez en el panel de Render y nunca viven en el repositorio.
services:
  - type: web
    name: historias-de-usuario
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free               # prueba sin costo: sin disco persistente y el servicio se duerme sin uso
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    # Para datos permanentes: cambie a `plan: starter` y descomente el disco.
    # disk:
    #   name: datos
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: ANALISTA_PUBLICO
        value: "1"
      - key: OPENCODE_PROVIDER_ID
        value: opencode-go
      - key: OPENCODE_MODEL_ID
        value: glm-5.3-flash
      - key: OPENCODE_SERVER_PASSWORD
        generateValue: true
      - key: OPENCODE_API_KEY
        sync: false
      - key: VITE_ANIO         # año del pie de página (de compilación: al cambiarlo se vuelve a desplegar)
        value: "2026"
      - key: VITE_VERSION      # versión del pie de página (de compilación)
        value: "1.0.0"
      - key: DATABASE_URL     # cadena de conexión de TiDB Cloud Starter (ver DESPLIEGUE.md)
        sync: false
      - key: ACCESO_USUARIO
        sync: false
      - key: ACCESO_CLAVE
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: https://us.cloud.langfuse.com
      # La clave solo se configura en el panel de Render; sync:false la excluye del repositorio.
      - key: PINECONE_API_KEY
        sync: false
      # Índice denso convencional: AWS us-east-1, 1024 dimensiones, cosine, multilingual-e5-large.
      # Namespaces autorizados: glosario, estandares, checklist, hu_aprobadas, lecciones y codigo.
      - key: PINECONE_INDEX_NAME
        value: historias-usuario
      - key: PINECONE_CLOUD
        value: aws
      - key: PINECONE_REGION
        value: us-east-1
      - key: PINECONE_DIMENSION
        value: "1024"
      - key: PINECONE_METRIC
        value: cosine
      - key: PINECONE_EMBEDDING_MODEL
        value: multilingual-e5-large
      # Carga automática: al arrancar crea el índice si falta y carga solo lo que cambió; al aprobar HU o
      # lecciones las agrega. Con 0 se desactiva y la carga vuelve a ser manual (CLI de ingesta).
      - key: PINECONE_SINCRONIZACION_AUTOMATICA
        value: "1"
      # Tiempo máximo por agente (segundos). Cada agente hace varias llamadas al modelo.
      - key: ANALISTA_TURN_TIMEOUT_SECONDS
        value: "180"
      # Repositorio de código que revisa el Asesor Técnico (público, https, sin credenciales en la URL).
      # Vacío: se usa el ejemplo incluido en ejemplos/polizas_demo.
      - key: ASESOR_REPOSITORIO_URL
        value: https://github.com/Yuvania/codigo-ejemplo-polizas.git
      - key: ASESOR_REPOSITORIO_RAMA
        value: main
      # Transporte MCP entre cada agente y su servidor: memoria (mismo proceso, mismo protocolo MCP; evita
      # arrancar un proceso por consulta en el plan gratuito) o stdio (proceso aparte).
      - key: ANALISTA_MCP_TRANSPORTE
        value: memoria
