# Blueprint de Render: crea el servicio y lo despliega solo con cada cambio en main.
# Los valores con sync: false se piden una vez en el panel de Render y nunca viven en el repositorio.
services:
  - type: web
    name: historias-de-usuario
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free               # prueba sin costo: sin disco persistente y el servicio se duerme sin uso
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    # Para datos permanentes: cambie a `plan: starter` y descomente el disco.
    # disk:
    #   name: datos
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: ANALISTA_PUBLICO
        value: "1"
      - key: OPENCODE_PROVIDER_ID
        value: opencode-go
      - key: OPENCODE_MODEL_ID
        value: glm-5.3-flash
      - key: OPENCODE_SERVER_PASSWORD
        generateValue: true
      - key: OPENCODE_API_KEY
        sync: false
      - key: VITE_ANIO         # año del pie de página (de compilación: al cambiarlo se vuelve a desplegar)
        value: "2026"
      - key: VITE_VERSION      # versión del pie de página (de compilación)
        value: "1.0.0"
      - key: DATABASE_URL     # cadena de conexión de TiDB Cloud Starter (ver DESPLIEGUE.md)
        sync: false
      - key: ACCESO_USUARIO
        sync: false
      - key: ACCESO_CLAVE
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: https://us.cloud.langfuse.com
